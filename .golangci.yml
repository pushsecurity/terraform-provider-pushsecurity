version: "2"

linters:
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - predeclared
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign

  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    unparam:
      check-exported: false

  exclusions:
    rules:
      # Test helpers are shared across files in a package and are often written
      # before every caller exists, so an unused one is not dead code.
      - path: _test\.go
        linters: [unused, unparam]

formatters:
  enable:
    - gofmt
