name: Bug report
description: Something in the provider or push-tf-bootstrap does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove anything sensitive before you submit: API keys, employee
        addresses and your tenant's configuration. Security issues go through
        SECURITY.md, not here.
  - type: input
    id: provider-version
    attributes:
      label: Provider version
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: terraform-version
    attributes:
      label: Terraform version
      description: The output of `terraform version`.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: The smallest configuration that shows the problem.
      render: hcl
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: >
        The plan or apply output, and the error if there was one. A
        `TF_LOG=debug` log helps, but read it first: it can contain your
        tenant's configuration.
      render: shell
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. terraform apply
        2. Change ... in the console
        3. terraform plan
